# RSPRecomp's configuration for Mario Party (USA)'s audio microcode, aspMain. Graphics tasks go to RT64; the audio tasks
# the game sends need this microcode recompiled to run (src/main/main.cpp, get_rsp_microcode). tools/recompile.sh
# writes it into RecompiledFuncs/.
#
# - The text is the last 0xE20 bytes of the microcode text the decomp keeps as data at ROM 0xB2360 (marioparty3.yaml),
#   which ends at 0xB9550: rspboot, the graphics microcodes, then aspMain. Its first instructions read the task's
#   ucode_data (lw from DMEM 0x30 and 0x34).
# - text_address is the IMEM address its first byte runs at, 0x04001080, as Bomberman 64's recomp has the same
#   microcode (another Hudson game on the same libultra): the command table in its data (ROM 0xCA7B0, the decomp's
#   rodata there) is that recomp's byte for byte.
# - The command handlers are reached through that table, which RSPRecomp can't find by following the instructions, so
#   they are listed below: the data's halfwords from offset 0x10.

rom_file_path = "roms/marioparty3.us.z64"
text_offset = 0xB8730
text_size = 0xE20
text_address = 0x04001080

# C++, not C: the output includes librecomp's RSP header. CMakeLists.txt builds RecompiledFuncs/*.cpp with the game.
output_file_path = "RecompiledFuncs/aspMain_rsp.cpp"
output_function_name = "aspMain_run"

extra_indirect_branch_targets = [
    0x1118, 0x1470, 0x11DC, 0x1B38, 0x1214, 0x187C, 0x1254, 0x12D0,
    0x12EC, 0x1328, 0x140C, 0x1294, 0x1E24, 0x138C, 0x170C, 0x144C,
]
