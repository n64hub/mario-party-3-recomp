# N64Recomp's configuration for Mario Party 3 (USA), SHA-1 6beb80ff822b96bcf85dcdb512e8b2b7969d8259: it reads the
# game's code out of the ROM by the symbols tools/gen_syms.sh dumps from the decomp's ELF, and writes RecompiledFuncs/
# (tools/recompile.sh). The code is stored raw in the ROM: main after the boot code, and each of the 131 overlays
# (minigames, boards, menus, the three board_code segments) where marioparty3.yaml has it, so there is nothing to
# decompress first.
[input]
# The decomp's entrypoint (asm/entrypoint.s), the ROM header's.
entrypoint = 0x80000400
# Paths are relative to this file.
symbols_file_path = "syms/marioparty3.us.syms.toml"
rom_file_path = "roms/marioparty3.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Functions recompiled as empty ones.
stubs = [
    # libultra's rmon (2.0L/monutil), the debugger monitor's jump into its exception handler, which only a debugger
    # reaches: it stores k0 below its stack pointer, which N64Recomp can't analyze.
    "func_800818C8_main",
    # libleo's boot of a 64DD disk game, which the game links in and reaches only with a 64DD attached, which the
    # runtime never reports: func_80071B50_main decodes the code after it (the ROM holds it scrambled, which
    # N64Recomp can't analyze) and calls it.
    "func_80071B50_main",
    "func_80071C8C_main",
]
# Functions written as <name>_recomp: their names are the C library's too (the game's libm, lib/marioparty3's
# src/libm, which N64Recomp recompiles rather than leaves out, as it does sinf, sqrt and the rest).
renamed = [
    "atan2",
    "exp",
    "expf",
    "log",
    "logf",
]

# The survey (patches/survey.c): the overlay a script asked for, in place of the one the game goes to.
[[patches.hook]]
func = "omOvlGotoEx"
before_vram = 0x80048228
text = "{ void mp_survey_goto(uint8_t*, gpr*, gpr*, gpr*); mp_survey_goto(rdram, &ctx->r4, &ctx->r5, &ctx->r6); }"

# The scissor pfDrawFonts sets for the text it draws, and leaves set for what is drawn after it, reaches row 339 of a
# 240-line picture: (0, 0, 319, 339) in place of (0, 0, 319, 240). A board's objects that the camera has at the
# picture's bottom then draw past it, which on a console writes a few pixels into the next framebuffer's top rows,
# under the overscan border, but in RT64 makes the frame as tall as the scissor: RT64 copies whole rows of it to RAM,
# over the top of the next framebuffer, takes that one's RAM as changed and draws it from RAM, so an old frame can
# flash up at 4:3 with black at its sides. Each of the function's two scissors stops at the picture's bottom instead.
[[patches.hook]]
func = "pfDrawFonts"
before_vram = 0x8004E07C
text = "ctx->r2 = 0x004FC3C0;"

[[patches.hook]]
func = "pfDrawFonts"
before_vram = 0x8004E644
text = "ctx->r2 = 0x004FC3C0;"

# The board's HUD at the picture's sides (lib/mario-party-engine/src/hud.cpp says how): the players' panels' places and
# groups (the shared board's MBStatusPosSet(player, x, y) sets a panel's place, and mbStatusData, 0x6C bytes a player,
# has the panel's group at 0xA), the groups killed (HuSprGrpKill(group), and the sprite manager's init,
# func_80052330_main, which forgets them all; the groups' addresses are HuSprGrpData's) and each sprite drawn
# (func_800579E4_main(gfx, sprite), every path out of it through 0x800589B8 with gfx in s5).
[[patches.hook]]
func = "MBStatusPosSet"
before_vram = 0x800F4874
text = "{ void mp_hud_panel(uint8_t*, int32_t, gpr, int32_t, int32_t); int32_t p = (int32_t)ctx->r4; int16_t g = MEM_H(0xA, (gpr)(int32_t)0x801057E0 + p * 0x6C); mp_hud_panel(rdram, p, (gpr)(int32_t)MEM_W(g * 4, (gpr)(int32_t)0x800CDD70), 0x10, (int16_t)ctx->r5); }"

[[patches.hook]]
func = "HuSprGrpKill"
before_vram = 0x800525C8
text = "{ void mp_hud_group_killed(uint8_t*, gpr); mp_hud_group_killed(rdram, (gpr)(int32_t)MEM_W((int16_t)ctx->r4 * 4, (gpr)(int32_t)0x800CDD70)); }"

[[patches.hook]]
func = "func_80052330_main"
before_vram = 0x80052330
text = "{ void mp_hud_reset(uint8_t*); mp_hud_reset(rdram); }"

[[patches.hook]]
func = "func_800579E4_main"
before_vram = 0x800579E4
text = "{ void mp_hud_sprite_start(uint8_t*, gpr, gpr); mp_hud_sprite_start(rdram, ctx->r4, ctx->r5); }"

[[patches.hook]]
func = "func_800579E4_main"
before_vram = 0x800589B8
text = "{ void mp_hud_sprite_end(uint8_t*, gpr); mp_hud_sprite_end(rdram, ctx->r21); }"
