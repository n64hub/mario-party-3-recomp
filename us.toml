# River Raiders' river is three models (0x2A0001-3), each placed 1875 down the river from the one before it: at 0, -1875
# and -3750 (func_801060BC_river_raiders, from 0x8010D3C4), and each moved 17 towards the camera a frame and put back
# 1875 behind the last once it is 1875 past the start (func_80105FA0_river_raiders). Each one's water is a unit short
# of that, so between two of them is a gap a tenth of a pixel deep on the console's screen. The console puts a
# vertex on a quarter of a pixel, so both edges land on the same row and the gap never shows; RT64 draws them where
# they are, and at a higher resolution the gap is a darker row across the river, of what is behind it. The models are
# placed 1873.5 apart instead, so each one's water reaches half a unit over the next one's.
[[patches.hook]]
func = "func_801060BC_river_raiders"
before_vram = 0x8010610C
text = "ctx->f0.fl *= 1873.5f / 1875.0f;"

[[patches.hook]]
func = "func_80105FA0_river_raiders"
before_vram = 0x80105FFC
text = "ctx->f2.fl = 1873.5f;"

# M.P.I.Q.'s stalks: under each player's cap, a number segment for each point, three of them 50 apart (at -44, 6 and 56,
