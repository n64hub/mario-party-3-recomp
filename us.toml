# A 3D model's parts paired with their own between the game's frames (lib/mario-party-engine/src/model_ids.cpp says
# how). func_8001B0B4_main walks the models for each camera (a u8 at 0x800CD6A6), s3 the slot of the one whose parts
# func_80023404_main(data, ...) queues (from 0x8001BA74, its data in s2). func_80024DF0_main queues a part of the model
# in s1, its place in the queue in a1 and its part number in s3, from 0x8002507C. func_800250D4_main draws the queue:
# each part's gSPMatrix from 0x8002558C, at s0, the list's next command (0x800D1FF4) already past it, with the part's
# place (s1, of 0x58 bytes from the queue's start at 0x800CC0BC) and its matrix (at 0x44), then its display list through
# func_80024814_main, back at 0x800255C0. The frame's number is at 0x800D20AC, and its display list starts at
# 0x800D1FF8, 0x800D5306 commands long.
