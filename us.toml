# (func_80108494_mpiq). A segment's origin is at its bottom, and at that scale it is about 3 short of the next one, so
# between the column and the numbers are gaps two thirds of a pixel deep at 320x240. The reference picture in #104 has
# the stalks solid; in RT64 what is behind the stalk shows through the gaps as thin teal and green rings, whole lines
# from 640x480 up and dashes at 320x240. Each segment is placed 5 lower and drawn 1.11 times as tall (its growth with
# it), so it reaches down over the gap below it and its top, with the number under the cap, stays where the game puts
# it: the stalk is solid white, as in that picture.
[[patches.hook]]
