# N64Recomp's configuration for Mario Party 3 (USA), SHA-1 6beb80ff822b96bcf85dcdb512e8b2b7969d8259: it reads the
# game's code out of the ROM by the symbols tools/gen_syms.sh dumps from the decomp's ELF, and writes RecompiledFuncs/
# (tools/recompile.sh). The code is stored raw in the ROM: main after the boot code, and each of the 131 overlays
# (minigames, boards, menus, the three board_code segments) where marioparty3.yaml has it, so there is nothing to
# decompress first.
[input]
# The decomp's entrypoint (asm/entrypoint.s), the ROM header's.
entrypoint = 0x80000400
# Paths are relative to this file.
symbols_file_path = "syms/marioparty3.us.syms.toml"
rom_file_path = "roms/marioparty3.us.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# Functions recompiled as empty ones.
stubs = [
    # libultra's rmon (2.0L/monutil), the debugger monitor's jump into its exception handler, which only a debugger
    # reaches: it stores k0 below its stack pointer, which N64Recomp can't analyze.
    "func_800818C8_main",
    # libleo's boot of a 64DD disk game, which the game links in and reaches only with a 64DD attached, which the
    # runtime never reports: func_80071B50_main decodes the code after it (the ROM holds it scrambled, which
    # N64Recomp can't analyze) and calls it.
    "func_80071B50_main",
    "func_80071C8C_main",
]
# Functions written as <name>_recomp: their names are the C library's too (the game's libm, lib/marioparty3's
# src/libm, which N64Recomp recompiles rather than leaves out, as it does sinf, sqrt and the rest).
renamed = [
    "atan2",
    "exp",
    "expf",
    "log",
    "logf",
]

# The survey (patches/survey.c): the overlay a script asked for, in place of the one the game goes to.
[[patches.hook]]
func = "omOvlGotoEx"
before_vram = 0x80048228
text = "{ void mp_survey_goto(uint8_t*, gpr*, gpr*, gpr*); mp_survey_goto(rdram, &ctx->r4, &ctx->r5, &ctx->r6); }"

# The scissor pfDrawFonts sets for the text it draws, and leaves set for what is drawn after it, reaches row 339 of a
# 240-line picture: (0, 0, 319, 339) in place of (0, 0, 319, 240). A board's objects that the camera has at the
# picture's bottom then draw past it, which on a console writes a few pixels into the next framebuffer's top rows,
# under the overscan border, but in RT64 makes the frame as tall as the scissor: RT64 copies whole rows of it to RAM,
# over the top of the next framebuffer, takes that one's RAM as changed and draws it from RAM, so an old frame can
# flash up at 4:3 with black at its sides. Each of the function's two scissors is the whole screen's instead,
# (0, 0, 320, 240): it stops at the picture's bottom, and at 320, not 319, since RT64 draws a rectangle of the whole
# screen out to the window's edges only while it is as wide as every scissor in its framebuffer, and moves a
# rectangle's right edge onto its scissor's a pixel from it. The next frame's clear (func_8001BF90_main's fill
# rectangle of the background's colour), under the text's 319, would stay inside 4:3, so the window's sides would never
# be cleared and would keep what earlier frames left there.
[[patches.hook]]
func = "pfDrawFonts"
before_vram = 0x8004E07C
text = "ctx->r2 = 0x005003C0;"

[[patches.hook]]
func = "pfDrawFonts"
before_vram = 0x8004E644
text = "ctx->r2 = 0x005003C0;"

# The board's HUD at the picture's sides (lib/mario-party-engine/src/hud.cpp says how): the players' panels' places
# and groups (the shared board's MBStatusPosSet(player, x, y) sets a panel's place, and mbStatusData, 0x6C bytes a
# player, has the panel's group at 0xA and its xPos and yPos, the place the board moves it by, at 0x10), the groups
# killed (HuSprGrpKill(group), and the sprite manager's init, func_80052330_main, which forgets them all; the groups'
# addresses are HuSprGrpData's) and each sprite drawn (func_800579E4_main(gfx, sprite), every path out of it through
# 0x800589B8 with gfx in s5), with its width on the screen: its frame's width (a u16 at 0x4 of its frame, 12 bytes
# each, from the frames its data at 0x84 points to, by its frame's index at 0x90) by its x scale (a float at 0x18), as
# func_800579E4_main reads them, and where it is on the screen (two floats at 0x4, x and y).
[[patches.hook]]
func = "MBStatusPosSet"
before_vram = 0x800F4874
text = "{ void mp_hud_panel_at(uint8_t*, int32_t, gpr, int32_t, int32_t, gpr); int32_t p = (int32_t)ctx->r4; gpr s = (gpr)(int32_t)0x801057E0 + p * 0x6C; int16_t g = MEM_H(0xA, s); mp_hud_panel_at(rdram, p, (gpr)(int32_t)MEM_W(g * 4, (gpr)(int32_t)0x800CDD70), 0x10, (int16_t)ctx->r5, s + 0x10); }"

# A duel board's two panels the same way: func_800F6550_name_81(player, x, y) is its MBStatusPosSet, with a status of
# its own for each player (0x6C bytes from 0x80105630), the panel's group at 0x4 and its xPos and yPos at 0xC.
[[patches.hook]]
func = "func_800F6550_name_81"
before_vram = 0x800F6550
text = "{ void mp_hud_panel_at(uint8_t*, int32_t, gpr, int32_t, int32_t, gpr); int32_t p = (int32_t)ctx->r4; gpr s = (gpr)(int32_t)0x80105630 + p * 0x6C; int16_t g = MEM_H(0x4, s); mp_hud_panel_at(rdram, p, (gpr)(int32_t)MEM_W(g * 4, (gpr)(int32_t)0x800CDD70), 0x10, (int16_t)ctx->r5, s + 0xC); }"

[[patches.hook]]
func = "HuSprGrpKill"
before_vram = 0x800525C8
text = "{ void mp_hud_group_killed(uint8_t*, gpr); mp_hud_group_killed(rdram, (gpr)(int32_t)MEM_W((int16_t)ctx->r4 * 4, (gpr)(int32_t)0x800CDD70)); }"

[[patches.hook]]
func = "func_80052330_main"
before_vram = 0x80052330
text = "{ void mp_hud_reset(uint8_t*); mp_hud_reset(rdram); }"

[[patches.hook]]
func = "func_800579E4_main"
before_vram = 0x800579E4
text = "{ void mp_hud_sprite_width(uint8_t*, float); void mp_hud_sprite_at(uint8_t*, float, float); void mp_hud_sprite_start(uint8_t*, gpr, gpr); gpr s = ctx->r5; gpr data = (gpr)(int32_t)MEM_W(0x84, s); if (data != 0) { gpr frame = (gpr)(int32_t)MEM_W(0x0, data) + MEM_H(0x90, s) * 12; union { uint32_t u; float f; } scale; scale.u = (uint32_t)MEM_W(0x18, s); mp_hud_sprite_width(rdram, MEM_HU(0x4, frame) * scale.f); } union { uint32_t u; float f; } x, y; x.u = (uint32_t)MEM_W(0x4, s); y.u = (uint32_t)MEM_W(0x8, s); mp_hud_sprite_at(rdram, x.f, y.f); mp_hud_sprite_start(rdram, ctx->r4, ctx->r5); }"

[[patches.hook]]
func = "func_800579E4_main"
before_vram = 0x800589B8
text = "{ void mp_hud_sprite_end(uint8_t*, gpr); mp_hud_sprite_end(rdram, ctx->r21); }"

# A sprite func_800579E4_main draws through a matrix of its place, its rotation and its scale (bit 30 of its word at
# 0x24 set: the items a panel shows big at its item select, MBStatusItemSprCreate's, and one carried out of it) is two
# triangles, which RT64's rectangle alignment doesn't move: it loads the sprite's x (a float at 0x4) into f4 at
# 0x80058710 and takes 160 from it for the matrix's translation, so that x is moved as far as hud.cpp aligns the
# sprite's rectangles.
[[patches.hook]]
func = "func_800579E4_main"
before_vram = 0x80058714
text = "{ float mp_hud_sprite_shift(uint8_t*); ctx->f4.fl += mp_hud_sprite_shift(rdram); }"

# The item a player uses carried out of their panel by their character's hand (hud.cpp, mp_hud_item_at and
# mp_hud_hand_read). MBStatusItemPosSet(player, item, x, y) moves item number item, member item + 2 of the panel's
# group (its members' addresses from 0x10), whose place in the group is two floats at 0x48. The hand is the picture
# of the character whose turn it is (s8 at 0x800CD067; GwPlayer, 0x38 bytes a player from 0x800D1108, has the
# character at 0x3): DataRead(file) reads it, files 0x6A on by character, and func_80055024_main(group, member,
# sprite, ...) next sets it as the picture of the hand's group.
[[patches.hook]]
func = "MBStatusItemPosSet"
before_vram = 0x800F688C
text = "{ void mp_hud_item_at(uint8_t*, int32_t, gpr, gpr); int32_t p = (int32_t)ctx->r4; int32_t i = (int32_t)ctx->r5; if (p >= 0 && p < 4 && i >= 0 && i < 3) { int16_t g = MEM_H(0xA, (gpr)(int32_t)0x801057E0 + p * 0x6C); gpr group = (gpr)(int32_t)MEM_W(g * 4, (gpr)(int32_t)0x800CDD70); gpr s = (gpr)(int32_t)MEM_W(0x10 + (i + 2) * 4, group); mp_hud_item_at(rdram, p, s, s + 0x48); } }"

[[patches.hook]]
func = "DataRead"
before_vram = 0x80009C10
text = "{ void mp_hud_hand_read(uint8_t*, int32_t); uint32_t file = (uint32_t)ctx->r4; int8_t p = (int8_t)MEM_B(0, (gpr)(int32_t)0x800CD067); if (file >= 0x6A && file <= 0x71 && p >= 0 && p < 4 && MEM_BU(p * 0x38 + 3, (gpr)(int32_t)0x800D1108) == file - 0x6A) mp_hud_hand_read(rdram, p); }"

[[patches.hook]]
func = "func_80055024_main"
before_vram = 0x80055024
text = "{ void mp_hud_hand_group(uint8_t*, gpr); mp_hud_hand_group(rdram, (gpr)(int32_t)MEM_W((int16_t)ctx->r4 * 4, (gpr)(int32_t)0x800CDD70)); }"

# A screen wipe past 4:3 (lib/mario-party-engine/src/wipe.cpp says how): the wipe module's whole-screen rectangle
# (func_8006231C_main(gfx, alpha), out through 0x800623E8), and a shape wipe's rectangles around its square
# (func_800636D8_main, with gfx in t0, from 0x80063F68, where it has set their colour).
# This game's star grid (type 2, func_800641C8_main(gfx, progress)) draws six square rings of 32 pixels round the
# screen's centre twice, the star mask's texture rectangles then the colour's fill rectangles, each ring's alpha higher
# than the one inside it, the outermost the columns at 4:3's left and right edges: its rings go on past 4:3 where its
# star pass ends (0x80064C9C, gfx in t0, the progress still in f10) and where its colour pass ends (0x8006508C). Its stripes (types 0 and 3 to 0xA, func_800651F0_main) need nothing: each band's black is
# a fill rectangle of the screen's whole width, which reaches the window's edges as it is.
[[patches.hook]]
func = "func_8006231C_main"
before_vram = 0x8006231C
text = "{ void mp_wipe_fill_start(uint8_t*, gpr); mp_wipe_fill_start(rdram, ctx->r4); }"

[[patches.hook]]
func = "func_8006231C_main"
before_vram = 0x800623E8
text = "{ void mp_wipe_fill_end(uint8_t*, gpr); mp_wipe_fill_end(rdram, ctx->r4); }"

