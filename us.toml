before_vram = 0x8002558C
text = "{ gpr mp_model_push(uint8_t*, gpr, int32_t, gpr, int32_t, gpr, int32_t); gpr queue = (gpr)(int32_t)MEM_W(0, (gpr)(int32_t)0x800CC0BC); ctx->r16 = mp_model_push(rdram, ctx->r16, (int32_t)(ctx->r17 - queue) / 0x58, (gpr)(int32_t)MEM_W(0x44, ctx->r17), (int32_t)MEM_W(0, (gpr)(int32_t)0x800D20AC), (gpr)(int32_t)MEM_W(0, (gpr)(int32_t)0x800D1FF8), MEM_HU(0, (gpr)(int32_t)0x800D5306) * 8); MEM_W(0, (gpr)(int32_t)0x800D1FF4) = (int32_t)(ctx->r16 + 8); }"

[[patches.hook]]
func = "func_800250D4_main"
before_vram = 0x800255C0
